</head>
<body>
<div id="noise" aria-hidden="true"></div>
<div id="cursor-glow" aria-hidden="true"></div>
<div id="preloader" aria-hidden="true">
  <div class="pre-m">
    <svg viewBox="0 0 120 120" width="72" height="72">
      <defs>
        <linearGradient id="pg" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#7FB3FF"/>
          <stop offset="1" stop-color="#1E5AFF"/>
        </linearGradient>
      </defs>
      <path d="M10 100 L10 20 L40 20 L60 60 L80 20 L110 20 L110 100 L92 100 L92 48 L68 96 L52 96 L28 48 L28 100 Z" fill="url(#pg)"/>
    </svg>
  </div>
  <div class="pre-bar"><div class="pre-bar-fill"></div></div>
  <div class="pre-label">LOADING — MAHDI SHAFIEI</div>
</div>

<div id="root"></div>

<script type="text/babel" src="globe.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>
<script type="text/babel" src="pages2.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // Preloader
  window.addEventListener('load', function () {
    setTimeout(function () {
      var p = document.getElementById('preloader');
      if (p) { p.classList.add('done'); setTimeout(function(){ p.remove(); }, 800); }
    }, 600);
  });

  // Cursor glow — desktop only
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var glow = document.getElementById('cursor-glow');
    var rafId = 0, gx = 0, gy = 0;
    window.addEventListener('pointermove', function (e) {
      gx = e.clientX - 200; gy = e.clientY - 200;
      if (!rafId) rafId = requestAnimationFrame(function () {
        glow.style.transform = 'translate3d(' + gx + 'px,' + gy + 'px,0)';
        rafId = 0;
      });
    }, { passive: true });
  }
</script>
</body>
</html>

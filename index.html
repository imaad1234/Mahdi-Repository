<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Mahdi Shafiei — Design Versions</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  a { touch-action: manipulation; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #1a1f2e 0%, #0a0d14 60%);
    color: #e8ecf3;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    overscroll-behavior-y: none;
  }
  .wrap { width: 100%; max-width: 880px; }
  header { text-align: center; margin-bottom: 48px; }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #7FB3FF, #1E5AFF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.lede {
    color: #9aa4b8;
    margin: 0;
    font-size: clamp(14px, 1.6vw, 17px);
  }
  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  a.card {
    display: block;
    padding: 36px 28px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    text-decoration: none;
    color: inherit;
    transition: transform .25s ease, border-color .25s ease, background .25s ease;
  }
  @media (hover: hover) {
    a.card:hover {
      transform: translateY(-4px);
      border-color: rgba(127,179,255,0.5);
      background: linear-gradient(180deg, rgba(127,179,255,0.08), rgba(30,90,255,0.03));
    }
  }
  a.card:active {
    transform: translateY(-1px);
    border-color: rgba(127,179,255,0.4);
    background: linear-gradient(180deg, rgba(127,179,255,0.06), rgba(30,90,255,0.02));
  }
  .num {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, #7FB3FF, #1E5AFF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  .label {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sub { color: #9aa4b8; font-size: 13px; }
  footer {
    text-align: center;
    margin-top: 48px;
    color: #5a6478;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mahdi Shafiei</h1>
    <p class="lede">Three design directions — pick one to preview.</p>
  </header>
  <div class="grid">
    <a class="card" href="1/">
      <div class="num">1</div>
      <div class="label">Multi-page</div>
      <div class="sub">Full site with About, Learn, Mentor, Partner, Read, Community</div>
    </a>
    <a class="card" href="2/">
      <div class="num">2</div>
      <div class="label">Light single-page</div>
      <div class="sub">Long-form scrolling layout</div>
    </a>
    <a class="card" href="3/">
      <div class="num">3</div>
      <div class="label">Interactive</div>
      <div class="sub">React-powered with 3D globe and animations</div>
    </a>
  </div>
  <footer>github.com/imaad1234/Mahdi-Repository</footer>
</div>
</body>
</html>
